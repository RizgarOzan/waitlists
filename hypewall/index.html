<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Old links used ?pack=anime|stoic|scripture. Send them to the pack's own page and keep the rest (like ?r=).
(function () {
  var p = new URLSearchParams(location.search), k = p.get('pack');
  if (k === 'anime' || k === 'stoic' || k === 'scripture') {
    p.delete('pack');
    var q = p.toString();
    location.replace(k + '/' + (q ? '?' + q : '') + location.hash);
  }
})();
</script>
<title>Hypewall</title>
<meta name="description" content="A real, sourced line on your iPhone lock screen. Anime, Stoic or Scripture.">
<meta property="og:title" content="Hypewall">
<meta property="og:description" content="A real, sourced line on your iPhone lock screen. Anime, Stoic or Scripture.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23141414'/%3E%3Cpath d='M13 29V11h8a5 5 0 0 1 0 10h-8m7 0 6 8' fill='none' stroke='%23f4f1ea' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f1ea;color:#141414;font:400 18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:56px 16px 40px}
h1{font-size:26px;line-height:1.2;font-weight:700}
p{margin-top:14px;color:#3d3b37}
ul{list-style:none;margin-top:28px}
li + li{margin-top:12px}
li a{font-size:22px;font-weight:600;color:#141414;text-underline-offset:4px}
.soon{margin-top:28px;font-size:15px;color:#5d5a54}
footer{margin-top:40px;padding-top:18px;border-top:1px solid rgba(20,20,20,.14);font-size:14px}
footer a{color:#5d5a54}
</style>
</head>
<body>
<main>
  <h1>Hypewall</h1>
  <p>A real, sourced line on your iPhone lock screen.</p>
  <ul>
    <li><a href="anime/">Anime</a></li>
    <li><a href="stoic/">Stoic</a></li>
    <li><a href="scripture/">Scripture</a></li>
  </ul>
  <p class="soon">Coming soon: Discipline (Goggins), Faith · Islam (Qur'an)</p>
  <footer><a href="../privacy.html">Privacy</a></footer>
</main>
<script>
// Carry ?r= and friends onto the pack links so the sign-up still knows where the visitor came from.
if (location.search) document.querySelectorAll('ul a').forEach(function (a) { a.href = a.getAttribute('href') + location.search; });
</script>
